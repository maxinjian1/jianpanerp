# japanerp.com — Lightsail 只做公网入口（2026-10-14 起）
#
# /api/inventory/*   → inventory-api 容器（旧库存 API，仓库人员在用，保留）
# /api/v1/*          → Windows 开发机 api-core :4000（经 Tailscale）
# /                  → Windows 开发机 web-client :3000（经 Tailscale）
#                      Windows 离线时回退到 /usr/share/nginx/html 的静态导出页
#
# 部署：替换 /home/ubuntu/japan-erp/deploy/nginx/conf.d/app.conf，
#       docker exec japan-erp-nginx nginx -t && docker exec japan-erp-nginx nginx -s reload
# 前提：宿主对 docker bridge → tailscale0 做了 MASQUERADE（见 scripts/tailscale-docker-snat.sh）

# Windows 开发机（Tailscale IP）。V64 到手后改成 V64 的 Tailscale IP 即可。
upstream win_web { server 100.120.180.90:3000 max_fails=2 fail_timeout=10s; }
upstream win_api { server 100.120.180.90:4000 max_fails=2 fail_timeout=10s; }

# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name japanerp.com www.japanerp.com;
  location = /healthz { return 200 "ok"; }
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# HTTPS main server
server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name japanerp.com www.japanerp.com;

  ssl_certificate /etc/letsencrypt/live/japanerp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/japanerp.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/japanerp.com/chain.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2;

  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # 通用反代头
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;

  # ── Inventory API（旧库存 API，保留原样）──────────────────────────────
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/inventory/ {
    set $upstream_inventory http://inventory-api:4100;
    rewrite ^/api/inventory/(.*) /$1 break;
    proxy_pass $upstream_inventory;
    proxy_read_timeout 30;
    proxy_intercept_errors on;
    error_page 502 503 504 = @inventory_down;
  }
  location @inventory_down {
    default_type application/json;
    return 503 '{"error":"inventory_api_offline","message":"在庫APIが応答していません。しばらくお待ちください。"}';
  }

  # ── api-core（Windows / V64）──────────────────────────────────────────
  location /api/v1/ {
    proxy_pass http://win_api;
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_down;
  }
  location @api_down {
    default_type application/json;
    return 503 '{"error":"api_offline","message":"APIサーバーに接続できません。しばらくお待ちください。"}';
  }

  # ── Product images（旧库存 API 上传的图片，保留）─────────────────────
  location ^~ /img/ {
    alias /srv/inventory-data/images/;
    expires 30d;
    add_header Cache-Control "public" always;
    access_log off;
  }

  # ── 网站本体：优先 Windows 上的 Next，离线回退静态导出 ──────────────────
  location / {
    proxy_pass http://win_web;
    proxy_intercept_errors on;
    error_page 502 503 504 = @static_fallback;
  }
  location @static_fallback {
    add_header X-Served-By "static-fallback" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri.html $uri/index.html /index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}

# WebSocket upgrade 映射（Next dev HMR / 将来的实时功能）
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
